version: '3.8'

services:
  web:
    image: tag-executive-assistant-web:latest
    build: .
    container_name: tag-executive-assistant-web
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - TZ=America/New_York
    volumes:
      # Everything that must survive a redeploy (see docs/DEPLOY.md):
      #   data/      the database (notes, briefs, approvals, what it has learned) and meeting recordings
      #   .secrets/  Microsoft sign-in tokens for Dave and Geronimo, and the Mealeo browser profile
      - ./data:/app/data
      - ./.secrets:/app/.secrets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    # One instance only: the background worker sends Teams messages and sweeps the inbox
    restart: unless-stopped
    networks:
      - shared-n8n-network

networks:
  shared-n8n-network:
    external: true
    name: n8n-network
