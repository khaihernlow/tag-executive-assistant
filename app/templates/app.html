<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>TAG Assistant</title>
  <meta name="theme-color" content="#F6F2E9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14171C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Assistant">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="/static/app.css?v={{ v }}">
</head>
<body>
  <!-- Phone: Today and Chat are tabs. Desktop (wide screens): the day on the left,
       the assistant always open on the right, details open over the assistant. -->
  <div class="sheet" data-tab="today">
    <div class="panes">
      <!-- Desktop: the day collapsed to a thin strip, with what still needs Dave -->
      <aside class="day-rail" id="day-rail" aria-label="Your day (hidden)">
        <button class="tool-btn" id="day-expand" type="button" title="Show the day" aria-label="Show the day">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15M13 10l2 2-2 2"/></svg>
        </button>
        <span class="count" id="rail-count" title="Needs you"></span>
      </aside>
      <!-- The day: what Dave glances at between meetings -->
      <main class="scroll view pane pane--day" id="view-today" aria-label="Today">
        <header class="pane-head">
          <h1 class="pane-head__title" id="date">{{ today }}</h1>
          <button class="tool-btn desk-only" id="day-collapse" type="button" title="Hide the day" aria-label="Hide the day">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15M15 10l-2 2 2 2"/></svg>
          </button>
        </header>
        <div class="skeleton-day" id="today-skeleton" aria-hidden="true">
          <div class="skel skel--label"></div><div class="skel skel--title"></div><div class="skel skel--line"></div>
          <div class="skel skel--label skel--gap"></div>
          <div class="skel-card"><div class="skel skel--row"></div><div class="skel skel--row"></div><div class="skel skel--row"></div></div>
          <div class="skel skel--label skel--gap"></div>
          <div class="skel-card"><div class="skel skel--row"></div><div class="skel skel--row"></div><div class="skel skel--row"></div><div class="skel skel--row"></div></div>
        </div>
        <section class="block next" id="next-block" aria-label="Next up" hidden></section>

        <section class="block" aria-labelledby="needs-title" id="needs-block" hidden>
          <h2 class="block__title" id="needs-title">Needs you <span class="count" id="needs-count"></span></h2>
          <ul class="needs" id="needs"></ul>
        </section>

        <section class="block" aria-labelledby="today-title" id="agenda-block" hidden>
          <h2 class="block__title block__title--split"><span id="today-title">Today</span>
            <span class="block__aside" id="done-today" hidden></span></h2>
          <ol class="itinerary" id="itinerary">

          </ol>
        </section>

        <!-- An FYI log of what the assistant tidied, so it sits last and starts collapsed. -->
        <section class="block" aria-labelledby="junk-title" id="junk-block" hidden>
          <h2 class="block__title" id="junk-title">Tidied up</h2>
          <div id="junk"></div>
        </section>
      </main>

      <!-- Desktop: drag to make the day wider or narrower -->
      <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize the day" tabindex="0"></div>

      <!-- The assistant -->
      <section class="pane pane--chat" aria-label="Assistant">
        <header class="pane-head pane-head--chat chat-only">
          <h2 class="pane-head__title pane-head__title--chat" id="chat-title">New chat</h2>
          <div class="pane-head__actions">
            <button class="tool-btn" id="recent-btn" type="button" aria-expanded="false" aria-controls="recent">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2"/><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/></svg>
              <span>Recent</span>
            </button>
            <button class="tool-btn" id="memory-btn" type="button" aria-expanded="false" aria-controls="memory">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.6 2.2 4.6.6.6.8 1.2.8 1.9V17h6v-1.5c0-.7.2-1.3.8-1.9 1-1 2.2-2.4 2.2-4.6a6 6 0 0 0-6-6z"/><path d="M9.5 20.5h5"/></svg>
              <span>Remembered</span>
            </button>
            <button class="tool-btn tool-btn--primary" id="new-chat" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <span>New chat</span>
            </button>

          </div>
        </header>
        <main class="scroll view" id="view-chat" aria-label="Chat" hidden>
          <section class="block block--thread" aria-label="Conversation">
            <p class="topic" id="topic" hidden></p>
            <div class="thread" id="thread" aria-live="polite"></div>
            <div class="thread-end" id="thread-end" aria-hidden="true"></div>
            <div class="thread__empty" id="thread-empty">
              <p>Ask about your calendar, email, Autotask, or anyone you're meeting. For example:</p>
              <div class="suggestions">
                <button type="button" class="suggestion">What's on my calendar tomorrow?</button>
                <button type="button" class="suggestion">Which quotes are waiting on clients?</button>
                <button type="button" class="suggestion">What's coming up for renewal this month?</button>
                <button type="button" class="suggestion">Who didn't log their time last week?</button>
              </div>
            </div>
          </section>
        </main>

        <button class="to-latest chat-only" id="to-latest" type="button" aria-label="Jump to the latest message" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </button>
        <form class="composer chat-only" id="composer" autocomplete="off">
          <div class="composer__box">
            <label class="visually-hidden" for="input">Ask your assistant</label>
            <textarea id="input" rows="1" placeholder="Ask your assistant…" enterkeyhint="send"></textarea>
            <button class="send" id="send" type="submit" aria-label="Send" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </div>
        </form>

        <!-- One item from "Needs you", opened in full: over everything on a phone, over the assistant on desktop -->
        <div class="overlay detail" id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="detail-title">
          <div class="overlay__bar">
            <button class="link-btn" id="detail-close" type="button">‹ Back</button>
          </div>
          <div class="overlay__body">
            <!-- The card says what it is; these are for screen readers. -->
            <p class="visually-hidden" id="detail-kind"></p>
            <h2 class="visually-hidden" id="detail-title"></h2>
            <div id="detail-body"></div>
          </div>
        </div>

        <!-- Meeting brief: same place as a detail -->
        <div class="overlay briefsheet" id="briefsheet" hidden role="dialog" aria-modal="true" aria-labelledby="bs-title">
          <div class="overlay__bar briefsheet__bar">
            <button class="link-btn" id="bs-close" type="button">‹ Back</button>
            <button class="link-btn" id="bs-refresh" type="button" hidden>Update brief</button>
          </div>
          <div class="overlay__body briefsheet__body">
            <p class="slip__kind">Meeting brief</p>
            <h2 class="briefsheet__title" id="bs-title"></h2>
            <p class="briefsheet__when" id="bs-when"></p>
            <div id="bs-content"></div>
          </div>
          <div class="briefsheet__foot" id="bs-foot" hidden>
            <button class="btn btn--sign" id="bs-ask" type="button">Ask about this meeting</button>
          </div>

          <!-- A cited source, opened from a citation or the Sources list -->
          <div class="source" id="source" hidden>
            <div class="source__panel" role="dialog" aria-labelledby="src-title">
              <div class="recent__head">
                <p class="slip__kind" id="src-kind"></p>
                <button class="link-btn" id="src-close" type="button">Close</button>
              </div>
              <h3 class="source__title" id="src-title"></h3>
              <p class="source__meta" id="src-meta"></p>
              <p class="source__excerpt" id="src-excerpt"></p>
              <a class="btn btn--sign source__open" id="src-open" target="_blank" rel="noopener" hidden></a>
            </div>
          </div>
        </div>
      </section>
    </div>

    <nav class="tabs" aria-label="Sections">
      <button class="tab" type="button" data-tab="today" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        Today
      </button>
      <button class="tab" type="button" data-tab="chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18l-1 3 4-2h9a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v8"/></svg>
        Chat
      </button>
    </nav>
  </div>

  <!-- Recent (with search) and Remembered: a pop-up near the top of the screen -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="modal" id="recent" hidden role="dialog" aria-label="Search conversations">
    <div class="modal__search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <label class="visually-hidden" for="recent-search">Search conversations</label>
      <input id="recent-search" type="search" placeholder="Search conversations" autocomplete="off" enterkeyhint="search">
      <button class="link-btn" id="recent-close" type="button">Close</button>
    </div>
    <ul class="modal__list rows" id="recent-list"></ul>
  </div>
  <div class="modal" id="memory" hidden role="dialog" aria-labelledby="memory-title">
    <div class="modal__head">
      <h2 class="modal__title" id="memory-title">What I remember</h2>
      <button class="link-btn" id="memory-close" type="button">Close</button>
    </div>
    <p class="modal__hint">Tell me things in chat, like “Kai means Khaihern” or “no meetings before 8:30”.</p>
    <ul class="modal__list rows" id="memory-list"></ul>
  </div>

  <script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
